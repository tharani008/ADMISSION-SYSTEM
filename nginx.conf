# =============================================================
#  Nginx Configuration for Lasak Tech - VPS Deployment
#  Place this file at: /etc/nginx/sites-available/lasak
#  Then run: sudo ln -s /etc/nginx/sites-available/lasak /etc/nginx/sites-enabled/
#  And: sudo nginx -t && sudo systemctl reload nginx
# =============================================================

# ── 1. admissions.lasakedu.in  (Full Admission Landing Page) ────
server {
    listen 80;
    server_name admissions.lasakedu.in;
    root /var/www/admissions.lasakedu.in;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React SPA fallback (all routes → index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── 2. franchise.lasakedu.in  (Admin Panel) ────────────────────
server {
    listen 80;
    server_name franchise.lasakedu.in;
    root /var/www/franchise.lasakedu.in;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── 3. enrolled.lasakedu.in  (Enrollment Form) ─────────────────
server {
    listen 80;
    server_name enrolled.lasakedu.in;
    root /var/www/enrolled.lasakedu.in;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── 4. api.lasakedu.in  (Node.js Backend — reverse proxy) ──────
server {
    listen 80;
    server_name api.lasakedu.in;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
